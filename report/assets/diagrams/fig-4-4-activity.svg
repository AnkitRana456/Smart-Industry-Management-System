<rect width="1000" height="790" fill="#fff"/><rect x="10" y="10" width="240" height="770" fill="#fff" stroke="#6b7280" stroke-width="1.3"/><rect x="10" y="10" width="240" height="30" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.3"/><text x="130" y="30.1" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Times New Roman, serif">Manager (browser)</text><rect x="250" y="10" width="250" height="770" fill="#f8fafc" stroke="#6b7280" stroke-width="1.3"/><rect x="250" y="10" width="250" height="30" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.3"/><text x="375" y="30.1" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Times New Roman, serif">Express API</text><rect x="500" y="10" width="300" height="770" fill="#fff" stroke="#6b7280" stroke-width="1.3"/><rect x="500" y="10" width="300" height="30" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.3"/><text x="650" y="30.1" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Times New Roman, serif">Service layer and database</text><rect x="800" y="10" width="190" height="770" fill="#f8fafc" stroke="#6b7280" stroke-width="1.3"/><rect x="800" y="10" width="190" height="30" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.3"/><text x="895" y="30.1" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Times New Roman, serif">Connected clients</text><circle cx="130" cy="56" r="8" fill="#111"/><rect x="30" y="72" width="200" height="42" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="130" y="89.4" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">Select a new status</text><text x="130" y="106.2" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">for a machine</text><path d="M130,64 L130,72" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><path d="M230,93 L375,93 L375,112" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><polygon points="375,112 475,145 375,178 275,145" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="375" y="141.6" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">Valid JWT and</text><text x="375" y="157.2" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">manager or admin?</text><rect x="30" y="124" width="200" height="42" rx="3" fill="#fef2f2" stroke="#1f2937" stroke-width="1.6"/><text x="130" y="141.4" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">Show error</text><text x="130" y="158.2" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">(401 or 403)</text><path d="M275,145 L230,145" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="240" y="123" width="26" height="18" fill="#fff"/><text x="253" y="137.4" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">No</text><path d="M375,178 L375,210" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="377" y="184" width="32" height="18" fill="#fff"/><text x="393" y="198.4" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">Yes</text><polygon points="375,212 480,245 375,278 270,245" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="375" y="241.6" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">Body valid and</text><text x="375" y="257.2" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">status changed?</text><rect x="30" y="222" width="200" height="46" rx="3" fill="#fef2f2" stroke="#1f2937" stroke-width="1.6"/><text x="130" y="241.4" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">Show error</text><text x="130" y="258.2" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">(400 or 409)</text><path d="M270,245 L230,245" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="234" y="223" width="26" height="18" fill="#fff"/><text x="247" y="237.4" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">No</text><path d="M375,278 L375,322 L650,322 L650,340" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="377" y="290" width="32" height="18" fill="#fff"/><text x="393" y="304.4" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">Yes</text><rect x="532" y="340" width="236" height="46" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="650" y="359.4" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">Close open downtime log,</text><text x="650" y="376.2" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">record its duration</text><path d="M650,386 L650,412" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="532" y="412" width="236" height="46" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="650" y="431.4" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">Open a new log and</text><text x="650" y="448.2" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">update the machine</text><path d="M650,458 L650,487" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><polygon points="650,487 760,520 650,553 540,520" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="650" y="516.6" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">New status</text><text x="650" y="532.2" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">is offline?</text><path d="M650,553 L650,590" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="652" y="561" width="32" height="18" fill="#fff"/><text x="668" y="575.4" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">Yes</text><rect x="532" y="590" width="236" height="46" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="650" y="609.4" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">Raise critical alert and open</text><text x="650" y="626.2" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">corrective work order</text><path d="M540,520 L512,520 L512,683 L532,683" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="499" y="590" width="26" height="18" fill="#fff"/><text x="512" y="604.4" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">No</text><path d="M650,636 L650,660" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="532" y="660" width="236" height="46" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="650" y="679.4" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">Resolve earlier alert if any,</text><text x="650" y="696.2" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">refresh bottleneck flags</text><path d="M768,683 L805,683" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="805" y="653" width="180" height="60" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="895" y="671.8" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">Receive machine event,</text><text x="895" y="687.4" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">refresh cached data,</text><text x="895" y="703.0" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">show a toast</text><path d="M895,713 L895,738" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><circle cx="895" cy="750" r="11" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="895" cy="750" r="6" fill="#111"/></svg>