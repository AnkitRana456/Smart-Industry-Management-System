<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470"><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect width="1000" height="470" fill="#fff"/><rect x="10" y="10" width="980" height="235" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.3"/><text x="500" y="32.1" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Times New Roman, serif">AI-assisted query path (natural-language insights)</text><rect x="22" y="70" width="118" height="76" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="81" y="104.6" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">1 Manager asks</text><text x="81" y="120.2" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">in plain English</text><rect x="162" y="70" width="118" height="76" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="221" y="104.6" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">2 Validate input,</text><text x="221" y="120.2" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">role, rate limit</text><path d="M140,108 L162,108" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="302" y="70" width="118" height="76" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="361" y="96.8" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">3 Planner picks</text><text x="361" y="112.4" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">allow-listed tools</text><text x="361" y="128.0" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">and a period</text><path d="M280,108 L302,108" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="442" y="70" width="118" height="76" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="501" y="96.8" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">4 Tools run fixed</text><text x="501" y="112.4" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">database queries,</text><text x="501" y="128.0" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">compute figures</text><path d="M420,108 L442,108" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="582" y="70" width="118" height="76" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="641" y="96.8" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">5 LLM drafts a</text><text x="641" y="112.4" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">short answer from</text><text x="641" y="128.0" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">the evidence only</text><path d="M560,108 L582,108" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><path d="M700,108 L720,108" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><polygon points="782,60 844,108 782,156 720,108" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="782" y="104.9" text-anchor="middle" font-size="12"  fill="#111" font-family="Times New Roman, serif">6 Every number</text><text x="782" y="119.3" text-anchor="middle" font-size="12"  fill="#111" font-family="Times New Roman, serif">in the evidence?</text><path d="M844,108 L866,108" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="843" y="86" width="30" height="18" fill="#fff"/><text x="858" y="100.4" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">Yes</text><rect x="866" y="70" width="118" height="76" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="925" y="96.8" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">7 Answer card</text><text x="925" y="112.4" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">with sources</text><text x="925" y="128.0" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">on the dashboard</text><rect x="710" y="188" width="144" height="50" rx="3" fill="#fff7ed" stroke="#1f2937" stroke-width="1.6"/><text x="782" y="209.9" text-anchor="middle" font-size="12"  fill="#111" font-family="Times New Roman, serif">Retry once, else</text><text x="782" y="224.3" text-anchor="middle" font-size="12"  fill="#111" font-family="Times New Roman, serif">show figures only</text><path d="M782,156 L782,188" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="785" y="160" width="26" height="18" fill="#fff"/><text x="798" y="174.4" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">No</text><path d="M854,213 L925,213 L925,146" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><text x="300" y="224.4" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">Figures always come from the database; the LLM only phrases them.</text><rect x="10" y="260" width="980" height="200" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.3"/><text x="500" y="282.1" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Times New Roman, serif">Machine learning path (risk, anomaly, forecast)</text><rect x="30" y="320" width="205" height="76" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="132.5" y="346.0" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">Machine readings,</text><text x="132.5" y="362.8" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">service history,</text><text x="132.5" y="379.6" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">downtime, telemetry</text><rect x="275" y="320" width="205" height="76" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="377.5" y="346.0" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">Python FastAPI service:</text><text x="377.5" y="362.8" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">risk model, sensor model,</text><text x="377.5" y="379.6" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">anomaly, forecast</text><path d="M235,358 L275,358" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="520" y="320" width="205" height="76" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="622.5" y="346.0" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">Band, probability</text><text x="622.5" y="362.8" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">and top contributing</text><text x="622.5" y="379.6" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">factors</text><path d="M480,358 L520,358" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="765" y="320" width="205" height="76" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="867.5" y="346.0" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">Alert policy and</text><text x="867.5" y="362.8" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">dashboard badges</text><text x="867.5" y="379.6" text-anchor="middle" font-size="14"  fill="#111" font-family="Times New Roman, serif">(Low, Medium, High)</text><path d="M725,358 L765,358" fill="none" stroke="#1f2937" stroke-width="1.5"  marker-end="url(#arr)"/><text x="500" y="440.4" text-anchor="middle" font-size="13"  fill="#111" font-family="Times New Roman, serif">Both paths read the same MongoDB data; the ML service sees only numeric features.</text></svg>